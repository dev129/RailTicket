name: Deploy to Vercel

# Deploys on every push to the development branch.
# One-time setup (repo Settings -> Secrets and variables -> Actions):
#   Secret VERCEL_TOKEN        from https://vercel.com/account/tokens
#   Secret VERCEL_ORG_ID       from `vercel link` -> .vercel/project.json ("orgId")
#   Secret VERCEL_PROJECT_ID   from `vercel link` -> .vercel/project.json ("projectId")
# Set RAIL_API_BASE / RAIL_API_KEY / RAIL_API_HOST in the Vercel project's
# Environment Variables for live mode (do not commit them).

on:
  push:
    branches: [claude/railway-booking-journey-zy3hom, main]
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm i -g vercel@latest
      - name: Pull project settings
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
      - name: Deploy (production)
        run: vercel deploy --prod --yes --token=${{ secrets.VERCEL_TOKEN }}
