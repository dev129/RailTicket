name: Deploy to Cloud Run

# Deploys on every push to the development branch.
# One-time setup (repo Settings -> Secrets and variables -> Actions):
#   Secret  GCP_SA_KEY        JSON key of a service account with roles:
#                             run.admin, cloudbuild.builds.editor,
#                             artifactregistry.admin, iam.serviceAccountUser,
#                             storage.admin  (or use Workload Identity instead)
#   Variable GCP_PROJECT_ID   your GCP project id
#   Variable GCP_REGION       e.g. asia-south1
# Recommended alternative to GCP_SA_KEY: Workload Identity Federation
#   (google-github-actions/auth with workload_identity_provider) — keyless.

on:
  push:
    branches: [claude/railway-booking-journey-zy3hom, main]
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Deploy (builds from source via Cloud Build)
        run: |
          gcloud run deploy railengine \
            --source . \
            --project "${{ vars.GCP_PROJECT_ID }}" \
            --region "${{ vars.GCP_REGION }}" \
            --allow-unauthenticated \
            --port 8000
          # For live availability, add once (keeps keys out of the repo):
          #   gcloud run services update railengine --region $REGION \
          #     --set-env-vars RAIL_API_BASE=...,RAIL_API_HOST=... \
          #     --set-secrets RAIL_API_KEY=rail-api-key:latest
